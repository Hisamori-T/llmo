version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmo_secret}
      POSTGRES_DB: llmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://llmo:${DB_PASSWORD:-llmo_secret}@db:5432/llmo
      PORT: "8006"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/llmo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/ssl/llmo:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
