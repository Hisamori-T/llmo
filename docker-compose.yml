version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmo_secret}
      POSTGRES_DB: llmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://llmo:${DB_PASSWORD:-llmo_secret}@db:5432/llmo_v4
      PORT: "8006"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python worker/main.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://llmo:${DB_PASSWORD:-llmo_secret}@db:5432/llmo_v4
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # nginx は Docker compose では不使用。
  # ホスト nginx (systemd) が /etc/nginx/sites-enabled/llmo で
  # 127.0.0.1:8006(api) / 127.0.0.1:3001(web) へ直接 proxy する。

volumes:
  pgdata:
